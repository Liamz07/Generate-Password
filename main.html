<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <title>🔐 Password Generator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Quầng sáng làm nền -->
        <div class="glow-bg glow-1" aria-hidden="true"></div>
        <div class="glow-bg glow-2" aria-hidden="true"></div>

        <!-- Header -->
        <header class="header">
            <div class="tieu-de">
                <h1>🔐 Password Generator</h1>
                <p>Create a strong and secure password!</p>
            </div>
            <div class="lua-chon-giua-2">
                <label for="lua-chon">Theme</label>
                <select id="lua-chon">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Khung hiển thị Mật khẩu -->
            <section class="card section-1">
                <h2 class="section-title">Generated Password</h2>
                <div class="password-display-wrapper">
                    <input 
                        type="text" 
                        id="password" 
                        name="password" 
                        placeholder="Click generate to start" 
                        readonly
                    > 
                    <button type="button" class="btn-copy" id="btn-copy" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                        <span>Copy</span>
                    </button>
                </div>
            </section>

            <!-- Khung Cài đặt & Độ mạnh mật khẩu -->
            <div class="dashboard-grid">
                <!-- Settings Card -->
                <section class="card">
                    <h2 class="section-title">Password Settings</h2>
                    
                    <div class="setting-item">
                        <div class="setting-header">
                            <span>Length</span>
                            <span id="length-value" class="badge">8</span>
                        </div>
                        <input type="range" min="8" max="64" value="8" id="length-slider" class="custom-range">
                        <div class="range-limits">
                            <span>8</span>
                            <span>64</span>
                        </div>
                    </div>

                    <div class="options-grid">
                        <label class="checkbox-card" for="box1">
                            <input type="checkbox" id="box1" name="checkbox" value="uppercase" checked>
                            <span class="custom-checkbox"></span>
                            <span>Uppercase</span>
                        </label>
                        
                        <label class="checkbox-card" for="box2">
                            <input type="checkbox" id="box2" name="checkbox" value="lowercase" checked>
                            <span class="custom-checkbox"></span>
                            <span>Lowercase</span>
                        </label>

                        <label class="checkbox-card" for="box3">
                            <input type="checkbox" id="box3" name="checkbox" value="numbers" checked>
                            <span class="custom-checkbox"></span>
                            <span>Numbers</span>
                        </label>

                        <label class="checkbox-card" for="box4">
                            <input type="checkbox" id="box4" name="checkbox" value="symbols">
                            <span class="custom-checkbox"></span>
                            <span>Symbols</span>
                        </label>
                    </div>

                    <button type="button" class="btn-primary">Generate Password</button>
                </section>

                <!-- Strength Card -->
                <section class="card strength-card">
                    <h2 class="section-title">Password Strength</h2>
                    
                    <div class="strength-meter">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 80%;"></div>
                        </div>
                        <span class="strength-percent">80%</span>
                    </div>

                    <div class="strength-status">
                        <strong class="status-tag strong">Strong</strong>
                        <p>Your password is very secure and hard to guess!</p>
                    </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Liamz07</p>
            <span class="dot">•</span>
            <p>Version 1.0</p>
            <span class="dot">•</span>
            <p>Made by HTML, CSS & Javascript</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
